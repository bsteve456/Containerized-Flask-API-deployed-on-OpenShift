apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-api
  namespace: duma999-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manager-api
  template:
    metadata:
      labels:
        app: task-manager-api
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: flask
        image: ghcr.io/bsteve456/task-manager-api:2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        command:
        - gunicorn
        - --bind
        - 0.0.0.0:5000
        - --workers
        - "1"
        - app.main:app
        env:
        - name: FLASK_APP
          value: "app/main.py"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10