apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-manager-api
  template:
    metadata:
      labels:
        app: task-manager-api
    spec:
      containers:
      - name: flask
        image: task-manager-api:1.0
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_APP
          value: "app/main.py"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres123@postgres:5432/task_manager"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10