apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-manager-api
  template:
    metadata:
      labels:
        app: task-manager-api
    spec:
      containers:
      - name: flask-app
        image: task-manager-api:1.0
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_APP
          value: "app/main.py"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"